owner = "verbatim-core"
reviewed_on = "2026-07-24"
reconsider_when = """
If ADK-001 or another upstream runtime offers a public session model that can
carry Verbatim task metadata bounds and evidence linkage without format capture."""
upstream_candidates = ["adk-rust session primitives (future)", "rusqlite persistence"]
conformance_suite = ""
related_specs = ["ADK-001", "UPSTREAM-001"]
deletion_issue = ""

