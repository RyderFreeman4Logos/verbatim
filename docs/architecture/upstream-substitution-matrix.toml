[[subsystem]]
id = "retry-cancellation"
subsystem = "retry/cancellation"
disposition = "KEEP"
rationale = """
Task cancel, ingest-batch cancel, config-reload debounce, idle reclaim/exit, and
task-wait polling are product-specific control-plane semantics wired into
daemon task state machines rather than a generic retry crate. Commodity backoff
helpers may still be ADOPT/WRAP later for pure HTTP retries without changing
task cancel contracts."""
owner = "verbatim-daemon"
reviewed_on = "2026-07-24"
reconsider_when = """
When a conformance suite isolates pure HTTP retry from task cancel semantics,
and an upstream cancel/backoff crate matches daemon task metadata bounds without
weakening cancel observability."""
upstream_candidates = ["tokio::time", "tokio_util::sync::CancellationToken", "backoff crates"]
conformance_suite = ""
related_specs = ["UPSTREAM-001"]
deletion_issue = ""

[[subsystem]]
id = "session-checkpoint"
subsystem = "session/checkpoint"
disposition = "KEEP"
