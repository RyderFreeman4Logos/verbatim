# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = ".git/cargo-deny-advisory-dbs"
ignore = [
    # Transitive from reqwest -> rustls-pemfile. Archived crate, no upgrade path.
    "RUSTSEC-2025-0134",
    # Transitive from optional parser-pdfplumber -> pdfplumber-parse.
    # Keep the existing optional parser contract until upstream publishes a fixed
    # pdfplumber-parse release; the default pdf_oxide parser uses lopdf >=0.42.
    "RUSTSEC-2026-0187",
    # Transitive from the default PDF parser stack (lopdf/pdf_oxide -> ttf-parser).
    # The advisory has no safe upgrade path; keep the parser contract until
    # upstream migrates to a maintained font parser.
    "RUSTSEC-2026-0192",
    # bincode 1.x is unmaintained upstream but stable and widely used.
    # Upgrading to bincode 2.x changes the serialization format (not backward compatible).
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
