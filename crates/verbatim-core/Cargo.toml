[package]
name = "verbatim-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parser-pdf-oxide"]
parser-pdf-oxide = ["dep:image", "dep:lopdf", "dep:pdf_oxide"]
parser-pdfplumber = ["dep:image", "dep:lopdf", "dep:pdfplumber"]
parser-anydoc-pdf = ["dep:anydoc", "dep:pdf-inspector"]
qdrant = []

[dependencies]
anyhow.workspace = true
base64 = "0.22"
bincode = "1.3"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
async-trait.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
url.workspace = true
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "limits", "trace"] }
pdf_oxide = { version = "0.3", optional = true }
pdfplumber = { version = "0.2", optional = true }
lopdf = { version = "0.42", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
anydoc = { version = "=0.2.4", optional = true }
pdf-inspector = { version = "=1.14.2", optional = true }
pulldown-cmark = "0.12"
instant-distance = "0.6"
tantivy = "0.26"

[dev-dependencies]
proptest = "1"
tempfile = "3"
trybuild = "1"
