[package]
name = "verbatim-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parser-pdf-oxide"]
parser-pdf-oxide = ["dep:image", "dep:lopdf", "dep:pdf_oxide"]
parser-pdfplumber = ["dep:image", "dep:lopdf", "dep:pdfplumber"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
async-trait.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
url.workspace = true
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
pdf_oxide = { version = "0.3", optional = true }
pdfplumber = { version = "0.2", optional = true }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pulldown-cmark = "0.12"
instant-distance = "0.6"
tantivy = "0.26"

[dev-dependencies]
tempfile = "3"
